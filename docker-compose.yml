  # MySQL Database
  db:
    image: mysql:8.0
    container_name: landingcms-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "root_secret_password"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - landingcms-network
    command: --default-authentication-plugin=mysql_native_password

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: landingcms-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "8081:80"
    networks:
      - landingcms-network
    depends_on:
      - db

networks:
  landingcms-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
